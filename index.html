<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TopapStore - Top Up Game Terpercaya</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo">TopapStore</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="#">Cek Transaksi</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <div class="content-wrapper">
      <div style="padding: 25px;">
        <h3 class="section-title"><span>🔥</span>Game Populer</h3>

        <div class="selection-grid">

          <a href="/Topap/Game/ml.html" class="game-card">
            <img src="/Topap/img/ml.png" alt="Mobile Legends">
            <div class="game-title">
              Mobile Legends
            </div>
          </a>

          <a href="/Topap/Game/ff.html" class="game-card">
            <img src="https://via.placeholder.com/300x180.png?text=Free+Fire" alt="Free Fire">
            <div class="game-title">
              Free Fire
            </div>
          </a>

          <a href="/Topap/Game/roblox.html" class="game-card">
            <img src="https://via.placeholder.com/300x180.png?text=Roblox" alt="Roblox">
            <div class="game-title">
              Roblox
            </div>
          </a>

          <a href="/Topap/Game/valo.html" class="game-card">
            <img src="https://via.placeholder.com/300x180.png?text=Valorant" alt="Valorant">
            <div class="game-title">
              Valorant
            </div>
          </a>

        </div>
      </div>
    </div>

  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 LifeStore (Gracsia Andhika). Semua hak cipta dilindungi.</p>
