<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TopapStore - Top Up Game Terpercaya</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="header-container">
        <div class="logo-and-nav"> 
            <a href="index.html" class="logo">TopapStore</a>
            <nav>
                <a href="index.html">Home</a>
            </nav>
        </div>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Cari Game...">
            <button type="submit">Cari</button>
        </div>
    </div>
</header>

  <main class="container">
    <section class="banner-section">
        <img src="/Topap/img/banner.jpeg" alt="Keuntungan Join Reseller" class="main-banner-image">
        <div class="banner-indicators">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </section>
    <div class="content-wrapper">
      <div style="padding: 25px;">
        <h3 class="section-title-index"><span>🔥</span>Game Populer</h3>

        <div class="selection-grid" id="game-list-container">

          <a href="/Topap/Game/ml.html" class="game-card">
            <img src="/Topap/img/ml.jpeg" alt="Mobile Legends">
            <div class="game-title">
              Mobile Legends
            </div>
          </a>

          <a href="/Topap/Game/ff.html" class="game-card">
            <img src="/Topap/img/ff.jpeg" alt="Free Fire">
            <div class="game-title">
              Free Fire
            </div>
          </a>

          <a href="/Topap/Game/roblox.html" class="game-card">
            <img src="/Topap/img/roblox.jpeg" alt="Roblox">
            <div class="game-title">
              Roblox
            </div>
          </a>

          <a href="/Topap/Game/valo.html" class="game-card">
            <img src="/Topap/img/valo.jpeg" alt="Valorant">
            <div class="game-title">
              Valorant
            </div>
          </a>

          <a href="/Topap/Game/hok.html" class="game-card">
            <img src="/Topap/img/hok.jpeg" alt="HOK">
            <div class="game-title">
              HOK
            </div>
          </a>

        </div>
      </div>
    </div>

  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 LifeStore (Gracsia Andhika). Semua hak cipta dilindungi.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>

</html>
